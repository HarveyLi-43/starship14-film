function spring(t, f = 1, z = 1) {
  if (t <= 0) return 0;
  const w = TAU * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);

// 弹簧跟随：目标轨迹与临界阻尼冲激响应 h(τ)=ω²τe^{-ωτ} 做卷积 —— 无状态、可任意 seek
function follow(fn, t, f = 1.2, span = 1.6, n = 48) {

function shake(t, hits, amp = 8, f = 11, decay = 5, seed = 1) {

  return [960 + (v3.dot(d, r) / z / cam.tanFov) * 540, 540 - (v3.dot(d, u) / z / cam.tanFov) * 540, z];
}

async function loadFonts() {
  const defs = [['FilmSerif', FONT_DATA.serif400, '400'], ['FilmSerif', FONT_DATA.serif600, '600'], ['FilmMono', FONT_DATA.mono400, '400']];
  for (const [family, b64, weight] of defs) {
    if (!b64) continue;
    const bin = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    const face = new FontFace(family, bin.buffer, { weight });
    await face.load();
    document.fonts.add(face);
  }
}

// 机械式打字：每个字符（或单词）在一帧内出现，并有 8 px 的弹簧下落
function typeLine(c, str, x, y, font, color, t0, dt, t, { track = 0, byWord = false } = {}) {
  if (t < t0) return;
  c.font = font; c.fillStyle = color; c.textBaseline = 'alphabetic';
  const units = byWord ? str.split(/(?<= )/) : [...str];
  let xx = x;
  units.forEach((unit, i) => {
    const ti = t0 + i * dt;
    for (const ch of unit) {
      const w = ch === '\u2019' ? parseFloat(/(\d+)px/.exec(font)[1]) * 0.26 : c.measureText(ch).width;   // 思源宋体的 ’ 是全角
      if (t >= ti) c.fillText(ch, xx, y - 8 * (1 - spring(t - ti, 1.2, 0.7)));
      xx += w + track;
    }
  });
}

// ---------------------------------------------------------------- 太空着色器
const FS_SPACE = GLSL_COMMON + `
uniform vec2 uRes;
uniform float uMode;                 // 1 地球/月球  2 土星+虫洞  3 虫洞隧道  4 黑洞
uniform vec3 uCamPos; uniform mat3 uCamRot; uniform float uTanFov;
uniform vec3 uSunDir; uniform float uStarGain; uniform mat3 uSkyRot;
uniform vec3 uEarthPos; uniform float uEarthR; uniform float uNight; uniform float uCloudT;
uniform vec3 uMoonPos; uniform float uMoonR;
uniform vec3 uSatPos; uniform mat3 uSatRot;
uniform vec3 uWhPos; uniform float uWhR;
uniform float uTun; uniform vec2 uTunShake; uniform float uTunRoll; uniform float uTunLine;
uniform sampler2D uTab; uniform sampler2D uRow; uniform vec3 uTabInfo;   // (行数, 列数, φmax)
uniform float uAlphaC; uniform vec2 uDisk; uniform float uDiskT; uniform float uDiskGain;

vec3 camRay(vec2 p){ vec2 q = p*2.-1.; q.x *= uRes.x/uRes.y; return normalize(uCamRot*vec3(q*uTanFov, 1.)); }
float fbm3(vec3 p){ float a = .5, s = 0.; for(int i=0;i<5;i++){ s += a*vn3(p); p = p*2.03 + vec3(1.7,9.2,3.1); a *= .5; } return s; }

// 星空：单元格哈希，每格至多一颗星
vec3 starLayer(vec3 d, float scale, float density, float seed){
  vec3 p = d*scale; vec3 c = floor(p); vec3 r = h33(c + seed);
  if(r.x > density) return vec3(0.);
  vec3 sp = normalize(c + 0.2 + 0.6*h33(c + seed + 7.));
  float ang = length(d - sp);
  float pix = 2.*uTanFov/uRes.y;

vec3 galaxy(vec3 d){
  float b = dot(d, normalize(vec3(0.25, 1.0, 0.35)));
  float band = exp(-b*b*14.);
  float f = fbm3(d*5.5);
  return (vec3(0.30,0.33,0.42)*band*(0.25+0.75*f) + vec3(0.55,0.45,0.35)*band*band*pow(f, 3.)*0.9)*0.08;
}
vec3 sky(vec3 d){ d = uSkyRot*d; return (starLayer(d, 150., .075, 0.) + starLayer(d, 380., .05, 11.)*0.45 + galaxy(d))*uStarGain; }

vec2 sph(vec3 ro, vec3 rd, vec3 c, float r){
  vec3 oc = ro - c; float b = dot(oc, rd); float cc = dot(oc, oc) - r*r; float h = b*b - cc;
  if(h < 0.) return vec2(-1.); h = sqrt(h); return vec2(-b - h, -b + h);
}

// ---------------- 地球（km）
vec3 earthCol(vec3 p, vec3 n, vec3 rd){
  float ca = cos(uCloudT), sa = sin(uCloudT);
  vec3 m = vec3(ca*n.x - sa*n.z, n.y, sa*n.x + ca*n.z);
  vec3 ms = m*vec3(1., 1., 2.2);                                   // 拉长成「云街」
  float cl = fbm7(ms*7.0) + 0.25*(vn3(m*90.) - 0.5);
  float cloud = smoothstep(0.50, 0.68, cl);
  float ndl = dot(n, uSunDir);
  float day = smoothstep(-0.06, 0.10, ndl);
  vec3 ocean = vec3(0.010, 0.045, 0.13);
  vec3 hv = normalize(uSunDir - rd);
  float nh = max(dot(n, hv), 0.);
  float spec = pow(nh, 260.)*6. + pow(nh, 24.)*0.18;
  vec3 col = ocean*(0.25 + 1.1*max(ndl, 0.)) + vec3(1.0, 0.84, 0.62)*spec*day*(1. - cloud);
  vec3 cloudC = vec3(0.86, 0.9, 0.95)*(0.05 + 1.05*clamp(ndl*1.4 + 0.08, 0., 1.));
  col = mix(col, cloudC, cloud);
  col *= mix(vec3(1.), vec3(1.25, 0.62, 0.38), exp(-pow(ndl/0.09, 2.))*0.7);   // 晨昏线
  col *= mix(0.02, 1., day);
  col += (1. - day)*cloud*vec3(0.010, 0.013, 0.02)*uNight;                     // 月光下的云
  float mu = max(dot(n, -rd), 0.);
  float haze = pow(1. - mu, 4.);
  vec3 atm = vec3(0.28, 0.52, 1.0)*clamp(ndl + 0.2, 0., 1.);
  col = mix(col, atm, haze*0.8);
  return col;
}
vec3 atmoRim(vec3 ro, vec3 rd, vec3 c, float R){
  vec3 oc = c - ro; float tc = dot(oc, rd); if(tc < 0.) return vec3(0.);
  vec3 cp = ro + rd*tc; float d = length(cp - c); float hgt = d - R; if(hgt < 0.) return vec3(0.);
  vec3 n = normalize(cp - c); float sl = dot(n, uSunDir);
  float lit = smoothstep(-0.28, 0.25, sl);
  float g = exp(-hgt/(R*0.0034));
  vec3 col = mix(vec3(0.10, 0.22, 0.62), vec3(0.45, 0.72, 1.0), exp(-hgt/(R*0.0012)));
  vec3 term = vec3(0.95, 0.42, 0.22)*exp(-pow((sl + 0.04)/0.10, 2.));
  vec3 air = vec3(0.09, 0.30, 0.14)*exp(-pow((hgt - R*0.0142)/(R*0.0010), 2.))*uNight;
  return (col*lit + term)*g*1.5 + air*0.35;
}
vec3 moonCol(vec3 n){
  float a = 0.62 + 0.25*(fbm3(n*5.) - 0.5) - 0.18*smoothstep(0.55, 0.7, fbm3(n*2.2 + 4.));
  return vec3(0.9, 0.88, 0.85)*a*max(dot(n, uSunDir), 0.)*1.1;
}
vec3 sceneEarth(vec3 ro, vec3 rd){
  vec3 col = sky(rd);
  vec2 te = sph(ro, rd, uEarthPos, uEarthR);
  vec2 tm = uMoonR > 0. ? sph(ro, rd, uMoonPos, uMoonR) : vec2(-1.);
  float tE = te.x > 0. ? te.x : 1e20, tM = tm.x > 0. ? tm.x : 1e20;
  if(tM < tE){ vec3 p = ro + rd*tM; col = moonCol(normalize(p - uMoonPos)); }
  else if(tE < 1e19){ vec3 p = ro + rd*tE; col = earthCol(p, normalize(p - uEarthPos), rd); }
  else col += atmoRim(ro, rd, uEarthPos, uEarthR);
  return col;
}

// ---------------- 土星 + 虫洞（单位：土星半径）
float ringD(float r){
  if(r < 1.24 || r > 2.27) return 0.;
  float d;
  if(r < 1.53) d = 0.10 + 0.05*sin(r*90.);
  else if(r < 1.95) d = 0.80 + 0.12*sin(r*140.)*sin(r*37.);
  else if(r < 2.03) d = 0.04;
  else d = 0.52 + 0.08*sin(r*170.);
  if(abs(r - 2.214) < 0.006) d = 0.04;
  d *= 0.72 + 0.56*(vn3(vec3(r*420., 0.5, 0.5)) - 0.5) + 0.18*(vn3(vec3(r*1900., 3.5, 0.5)) - 0.5);
  return clamp(d, 0., 0.96);
}
bool hitPlanet(vec3 ro, vec3 rd, out float t){
  vec3 os = ro*vec3(1., 1./0.9, 1.), ds = rd*vec3(1., 1./0.9, 1.);
  float a = dot(ds, ds), b = dot(os, ds), c = dot(os, os) - 1.; float h = b*b - a*c;
  t = 1e20; if(h < 0.) return false;
  float t0 = (-b - sqrt(h))/a; if(t0 <= 0.) return false; t = t0; return true;
}
vec3 saturnCol(vec3 p, vec3 sun){
  vec3 n = normalize(p*vec3(1., 1./0.81, 1.));
  float lat = n.y;
  float band = 0.5 + 0.5*sin(lat*24. + 1.4*fbm3(vec3(lat*9., p.x*0.6, p.z*0.6)));
  vec3 base = mix(vec3(0.80, 0.70, 0.52), vec3(0.66, 0.56, 0.41), band*0.45);
  base = mix(base, vec3(0.52, 0.55, 0.54), smoothstep(0.72, 0.95, abs(lat)));
  float ndl = max(dot(n, sun), 0.);
  float sh = 1.;
  if(sun.y*p.y < 0.){ float t = -p.y/sun.y; vec3 q = p + sun*t; sh = 1. - 0.85*ringD(length(q.xz)); }
  return base*(ndl*sh*1.3 + 0.012);
}
vec3 ringCol(vec3 q, float r, vec3 sun){
  vec3 base = 1.25*mix(vec3(0.80, 0.72, 0.58), vec3(0.42, 0.38, 0.32), smoothstep(1.53, 1.24, r) + 0.35*smoothstep(2.03, 2.27, r));
  float tp; float sh = hitPlanet(q, sun, tp) ? 0.03 : 1.;
  return base*sh*(0.3 + 0.9*abs(sun.y));
}
vec3 otherSky(vec3 d, vec3 c){
  float g = max(dot(d, c), 0.);
  vec3 col = vec3(1.0, 0.76, 0.48)*pow(g, 60.)*2.4 + vec3(0.9, 0.62, 0.38)*pow(g, 8.)*0.22;
  vec3 ax = normalize(cross(c, vec3(0.2, 1., 0.1)));
  float band = exp(-pow(dot(d, ax)/0.035, 2.))*pow(g, 14.);
  col += vec3(1.0, 0.85, 0.62)*band*1.6;
  col += vec3(0.85, 0.6, 0.38)*pow(g, 2.5)*0.22*(0.4 + 0.9*fbm3(d*4. + 9.));   // 另一边的暖色星云
  col += starLayer(d, 170., .22, 57.)*1.6 + starLayer(d, 420., .12, 91.)*0.8;
  return col;
}
vec3 lensSky(vec3 ro, vec3 rd){
  if(uWhR <= 0.) return sky(rd);
  vec3 toW = uWhPos - ro; float dist = length(toW); vec3 c = toW/dist;
  float ts = asin(clamp(uWhR/dist, 0., 0.999));
  float cth = clamp(dot(rd, c), -1., 1.); float th = acos(cth);
  vec3 perp = rd - c*cth; float pl = length(perp); perp = pl > 1e-6 ? perp/pl : vec3(0., 1., 0.);
  if(th < ts){
    float e = th/ts;
    float psi = pow(e, 1.25)*2.9;
    vec3 od = cos(psi)*c - sin(psi)*perp;
    vec3 col = otherSky(od, c);
    col *= mix(1., 0.25, smoothstep(0.82, 1., e));
    col += vec3(0.75, 0.83, 1.)*exp(-pow((1. - e)/0.018, 2.))*0.5;
    return col;
  }
  float tE = ts*1.2;
  float beta = th - tE*tE/th;
  vec3 sd = cos(beta)*c + sin(beta)*perp;
  return sky(sd)*(1. + 1.2*exp(-pow((th - tE)/(0.05*ts), 2.)));
}
vec3 sceneSaturn(vec3 ro, vec3 rd){
  vec3 col = lensSky(ro, rd);
  vec3 o_ = uSatRot*(ro - uSatPos), d_ = uSatRot*rd, sun = uSatRot*uSunDir;
  float tp; bool hp = hitPlanet(o_, d_, tp);
  if(hp) col = saturnCol(o_ + d_*tp, sun);
  float tr = -o_.y/d_.y;
  if(tr > 0. && tr < tp){ vec3 q = o_ + d_*tr; float rr = length(q.xz); float dens = ringD(rr);
    if(dens > 0.) col = mix(col, ringCol(q, rr, sun), dens); }
  return col;
}

// ---------------- 虫洞隧道
vec3 tunnel(vec2 q){
  float scrim = mix(1., 0.3, smoothstep(-0.2, -0.55, q.y));   // 文字 3 所在的下三分之一压暗
  q += uTunShake;
  float cr = cos(uTunRoll), sr = sin(uTunRoll); q = mat2(cr, -sr, sr, cr)*q;
  float r = length(q), a = atan(q.y, q.x);
  float z = 0.45/max(r, 0.015) + uTun*7.;
  float warp = 0.22*sin(z*1.6 + a*2. + uTun*4.) + 0.08*sin(z*4.3 - a*3.);
  float slots = 110.;
  float sa = (a + warp)/TAU*slots; float si = floor(sa), sf = fract(sa);
  float hs = h13(vec3(si, 3., 7.));
  float streak = smoothstep(0.5, 0.0, abs(sf - 0.5))*step(0.62, hs);
  float along = pow(vn3(vec3(si*1.7, z*(0.4 + 0.8*hs), 1.)), 3.);
  float ripple = 0.6 + 0.4*sin(z*5. - uTun*16.);
  vec3 cold = vec3(0.72, 0.82, 1.), warm = vec3(1., 0.8, 0.55);
  vec3 col = mix(cold, warm, smoothstep(0.7, 0.05, r))*streak*along*ripple*2.4;
  col += warm*exp(-r*r/(0.004 + 0.02*uTun))*(0.25 + 0.5*uTun);
  col *= scrim;
  col += vec3(1., 0.92, 0.78)*uTunLine*exp(-pow(q.y/(0.003 + 0.02*uTunLine), 2.))*exp(-pow(q.x/(0.1 + 1.6*uTunLine), 2.))*4.;
  return col;
}

// ---------------- 卡冈图雅：查表的史瓦西测地线
float rowOf(float al){
  float N = uTabInfo.x, h = N*0.5;
  if(al < uAlphaC) return min((1. - pow(max(1. - al/uAlphaC, 0.), 1./3.))*(h - 1.), h - 1.001);
  return clamp(h + pow(clamp((al - uAlphaC)/(PI - uAlphaC), 0., 1.), 1./3.)*(h - 1.), h, N - 1.001);
}
float tabU(float row, float ph){
  float x = clamp(ph/uTabInfo.z*(uTabInfo.y - 1.), 0., uTabInfo.y - 1.001);
  float x0 = floor(x), fx = x - x0, y0 = floor(row), fy = row - y0;
  ivec2 i = ivec2(int(x0), int(y0));
  float a = texelFetch(uTab, i, 0).r, b = texelFetch(uTab, i + ivec2(1, 0), 0).r;
  float c = texelFetch(uTab, i + ivec2(0, 1), 0).r, d = texelFetch(uTab, i + ivec2(1, 1), 0).r;
  return mix(mix(a, b, fx), mix(c, d, fx), fy);
}
vec4 diskShade(vec3 Q, float r, vec3 kdir){
  float x = (r - uDisk.x)/(uDisk.y - uDisk.x);
  float th = atan(Q.z, Q.x);
  float ang = th - pow(r, -1.5)*uDiskT;
  float turb = fbm3(vec3(cos(ang)*2.4, sin(ang)*2.4, r*1.2));
  float fine = vn3(vec3(cos(ang)*7., sin(ang)*7., r*6.));
  float streak = 0.5 + 1.1*(turb - 0.5) + 0.45*(fine - 0.5);
  float T = pow(uDisk.x/r, 0.75)*pow(max(1. - sqrt(uDisk.x/r*0.97), 0.), 0.25)/0.49;
  vec3 vdir = normalize(cross(vec3(0., 1., 0.), Q));
  float v = clamp(sqrt(1./max(r - 2., 0.5)), 0., 0.6);
  float g = sqrt(1. - v*v)/(1. - v*dot(vdir, kdir))*sqrt(max(1. - 3./r, 0.05));
  float beam = mix(1., pow(g, 3.), 0.4);
  float I = pow(T, 2.4)*beam*max(streak, 0.05);
  float Tg = T*mix(1., g, 0.5);
  vec3 col = mix(vec3(0.62, 0.30, 0.12), vec3(0.98, 0.74, 0.44), smoothstep(0.12, 0.55, Tg));
  col = mix(col, vec3(1., 0.95, 0.86), smoothstep(0.55, 1.05, Tg));
  float a = smoothstep(0., 0.035, x)*(1. - smoothstep(0.45, 1., x))*clamp(0.5 + 0.7*streak, 0., 1.);
  return vec4(col*I*4.2*uDiskGain, clamp(a, 0., 0.97));
}
vec3 blackhole(vec3 ro, vec3 rd){
  vec3 e1 = normalize(ro);
  float al = acos(clamp(dot(rd, -e1), -1., 1.));
  vec3 tv = rd - dot(rd, e1)*e1; float tl = length(tv);
  vec3 e2 = tl > 1e-6 ? tv/tl : normalize(cross(e1, vec3(0.3, 1., 0.1)));
  float row = rowOf(al);
  float y0 = floor(row), fy = row - y0;
  vec4 r0 = texelFetch(uRow, ivec2(int(y0), 0), 0), r1 = texelFetch(uRow, ivec2(int(y0) + 1, 0), 0);
  float phEnd = (r0.x > 1e8 || r1.x > 1e8) ? 1e9 : mix(r0.x, r1.x, fy);
  float phCap = (r0.y > 1e8 || r1.y > 1e8) ? 1e9 : mix(r0.y, r1.y, fy);
  float lim = min(min(phEnd, phCap), uTabInfo.z);
  float a = dot(e1, vec3(0., 1., 0.)), b = dot(e2, vec3(0., 1., 0.));
  float ph0 = mod(atan(-a, b), PI);
  vec3 col = vec3(0.); float T = 1.;
  for(int k = 0; k < 4; k++){
    float ph = ph0 + float(k)*PI;
    if(ph >= lim) break;
    if(ph < 1e-3) continue;
    float u = tabU(row, ph); if(u <= 1e-5) break;
    float r = 1./u;
    if(r > uDisk.x && r < uDisk.y){
      vec3 dirp = cos(ph)*e1 + sin(ph)*e2;
      vec3 Q = r*dirp;
      float du = (tabU(row, ph + 0.01) - tabU(row, max(ph - 0.01, 0.)))/0.02;
      vec3 tang = (-du/(u*u))*dirp + r*(-sin(ph)*e1 + cos(ph)*e2);
      vec4 d = diskShade(Q, r, -normalize(tang));
      col += T*d.rgb*d.a; T *= 1. - d.a;
      if(T < 0.02) break;
    }
  }
  if(phEnd < 1e8) col += T*sky(cos(phEnd)*e1 + sin(phEnd)*e2);
  return col;
}

void main(){
  vec3 col;
  if(uMode < 1.5) col = sceneEarth(uCamPos, camRay(uv));
  else if(uMode < 2.5) col = sceneSaturn(uCamPos, camRay(uv));
  else if(uMode < 3.5){ vec2 q = uv*2. - 1.; q.x *= uRes.x/uRes.y; col = tunnel(q); }
  else {
    vec2 px = 1./uRes; col = vec3(0.);
    for(int i = 0; i < 2; i++) for(int j = 0; j < 2; j++) col += blackhole(uCamPos, camRay(uv + (vec2(i, j) - 0.5)*0.5*px));
    col *= 0.25;
  }
  o = vec4(col, 1.);
}`;

// ---------------------------------------------------------------- 合成 / 泛光 / 后期
const FS_COMPOSITE = GLSL_COMMON + `
uniform sampler2D uBg, uLayer; uniform float uBgOn;
void main(){
  vec3 bg = uBgOn > 0.5 ? texture(uBg, uv).rgb : vec3(0.);
  vec4 l = texture(uLayer, uv);
  vec3 lin = l.a > 1e-4 ? pow(l.rgb/l.a, vec3(2.2))*l.a : vec3(0.);
  o = vec4(bg*(1. - l.a) + lin, 1.);
}`;
const FS_DOWN = GLSL_COMMON + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThresh; uniform float uFirst;

// ---------------------------------------------------------------- 飞船尾部 3/4 视角（像素）
// A：尾部端面中心；axisAng：机体轴在画面里的方向（0 = 竖直向上）；tilt：端面椭圆扁率
// engines：{ r, th（端面极坐标，th=90° 朝镜头）, tb, eb, bl（喉部/出口半径、喷管长，单位为箭体半径）, on, heat, gim }
function aftView(c, o) {
  const [ax, ay] = o.A, ua = [Math.sin(o.axisAng), -Math.cos(o.axisAng)], p = [-ua[1], ua[0]];
  const { Ra, Rn, len, tilt } = o, rot = Math.atan2(p[1], p[0]);
  const N = [ax + ua[0] * len, ay + ua[1] * len];
  const g = c.createLinearGradient(ax - p[0] * Ra, ay - p[1] * Ra, ax + p[0] * Ra, ay + p[1] * Ra);
  g.addColorStop(0, '#2c3035'); g.addColorStop(0.3, PAL.steel); g.addColorStop(0.6, PAL.steelHi); g.addColorStop(0.8, PAL.steel); g.addColorStop(1, '#24272b');

  c.strokeStyle = rgba('#000000', 0.13); c.lineWidth = Math.max(1, Ra * 0.006);   // 纵向焊缝，交代圆柱体
  for (const fx of [-0.72, -0.35, 0.05, 0.42]) { c.beginPath(); c.moveTo(ax + p[0] * fx * Ra + ua[0] * Ra * tilt * 0.9, ay + p[1] * fx * Ra + ua[1] * Ra * tilt * 0.9); c.lineTo(N[0] + p[0] * fx * Rn, N[1] + p[1] * fx * Rn); c.stroke(); }

    const f = 1 - Math.pow(1 - k / 7, 1.6), cx2 = lerp(ax, N[0], f), cy2 = lerp(ay, N[1], f), rr = lerp(Ra, Rn, f);
    c.beginPath(); c.ellipse(cx2, cy2, rr, rr * tilt, rot, Math.PI, TAU); c.stroke();

    const q = [at(0, 0.05), at(0.34, 0.16), at(0.34, 0.8), at(0, 1.05)];

    c.lineTo(E[0] + p[0] * eb, E[1] + p[1] * eb); c.lineTo(T0[0] + p[0] * tb, T0[1] + p[1] * tb); c.fill();

// 飞船六台发动机的端面布局：3 台 RVac（外圈）+ 3 台海平面猛禽（内圈）

// ---------------------------------------------------------------- S1 点火环 0.0–2.4
const ENGINES33 = (() => {
  const e = [];
  for (let k = 0; k < 3; k++) e.push({ r: 0.85, a: (TAU * k) / 3 - Math.PI / 2, br: 0.62, ti: -0.35 + k * 0.05 });
  for (let k = 0; k < 10; k++) e.push({ r: 2.45, a: (TAU * k) / 10 + 0.31, br: 0.6, ti: 0.4 + k * 0.035 });
  for (let k = 0; k < 20; k++) e.push({ r: 3.9, a: (TAU * k) / 20, br: 0.54, ti: 0.8 + k * 0.018 });
  return e;
})();
const RING_PX = 300;   // 外环发动机圆心半径（像素）——与片尾卡冈图雅光子环对齐，循环时首尾咬合
const S1_STEAM = (() => { const r = mulberry32(101), a = []; for (let i = 0; i < 26; i++) a.push({ a: r() * TAU, r0: 820 + r() * 420, sp: 40 + r() * 90, rad: 120 + r() * 170 }); return a; })();

function S1(c, lt, fx) {

  c.save(); c.translate(cx + sh[0] + rum * fbm1(lt * 9, 1), cy + sh[1] + rum * fbm1(lt * 9, 2)); c.rotate(roll);

// ---------------------------------------------------------------- S2 凌日 2.4–6.4
const S2_PUFFS = (() => {
  const r = mulberry32(202), a = [];

})();
function S2(c, lt, fx) {

  const eR = (tau) => { const x = clamp(tau / 4); return 0.16 + 5.75 * (1 - Math.pow(1 - x, 1.55)); };   // 箭底仰角（含慢动作变速）
  const yR = 390 - 90 * Math.sin(Math.PI * clamp(lt / 2.3)) + 30 * smooth(2.6, 4, lt);   // 火箭中心在画面中的高度：跟拍滞后，先上漂再被拉回
  const eCam = eR(lt) + STACK * 0.5 - (540 - yR) / PXD;
  const Y = (e) => 540 - (e - eCam) * PXD;

  c.fillStyle = PAL.amberLo; c.fillRect(0, 0, 1920, 1080);
  let g = c.createRadialGradient(sunX, sy, 0, sunX, sy, 2300);
  g.addColorStop(0, '#E08A3C'); g.addColorStop(0.12, PAL.amberHi); g.addColorStop(0.4, PAL.amberMid); g.addColorStop(1, PAL.amberLo);
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);

  c.fillStyle = g; c.fillRect(0, hy - 0.8 * PXD, 1920, 0.8 * PXD);
  c.fillStyle = '#1a0d06'; c.fillRect(0, hy, 1920, Math.max(0, 1080 - hy));
  glow(c, sunX, sy, sunR * 5, PAL.sunRim, 0.35);

  g.addColorStop(0, PAL.sunCore); g.addColorStop(0.7, '#FFE09A'); g.addColorStop(0.93, '#FFC061'); g.addColorStop(1, PAL.sunRim);

  c.restore();

    const grow = 1 + 0.25 * lt * (0.5 + p.gr), x = rx + p.dx * (1 + 0.08 * lt), y = Y(p.e + 0.02 * lt * p.gr);

  typeLine(c, TEXT.t1.en1, tx, 742, FONT_SERIF(400, 68), PAL.type, 0.8, 0.04, lt, { track: 8 });
  typeLine(c, TEXT.t1.en2, tx, 808, FONT_MONO(46), PAL.type, 1.2, 0.035, lt, { track: 4 });
  typeLine(c, TEXT.t1.zh, tx, 890, FONT_SERIF(600, 52), PAL.typeDim, 1.6, 0.05, lt, { track: 3 });

// ---------------------------------------------------------------- S4 热分离 9.6–12.8
function S4(c, lt, fx) {
  const ang = (62 + (6 * lt) / 3.2) * DEG, dir = [Math.sin(ang), -Math.cos(ang)], pxm = 4.4;

  const flash = lt >= 0.8 ? Math.exp(-(lt - 0.8) / 0.22) : 0;
  const sh = shake(lt, [0.8], 10, 14, 4, 5);
  let g = c.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#020308'); g.addColorStop(0.75, '#060a14'); g.addColorStop(1, '#0d1a33');
  c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  c.save(); c.beginPath(); c.arc(960, 1000 + 9000, 9000, 0, TAU);   // 地球边缘的蓝色雾线
  g = c.createLinearGradient(0, 985, 0, 1080); g.addColorStop(0, '#6CB6FF'); g.addColorStop(0.08, '#2F5FB8'); g.addColorStop(0.5, '#10204a'); g.addColorStop(1, '#0a1328');
  c.fillStyle = g; c.fill(); c.restore();

  c.save(); c.translate(sh[0], sh[1]);

  const bTop = at(-boosterBack), flip = Math.max(0, lt - 1.5) * 11 * DEG;

    c.globalCompositeOperation = 'lighter'; c.fillStyle = gg; ellipse(c, 0, 300, 330 * (0.4 + 0.6 * jelly), 420); c.fill(); c.globalCompositeOperation = 'source-over';
    c.save(); c.translate(0, 1); plume(c, 300 * (0.3 + 0.7 * jelly), 10, 120 * jelly + 20, { t: lt, seed: 9, alpha: 0.8 * jelly + 0.2 }); c.restore();
  }

// ---------------------------------------------------------------- S5 海上 12.8–16.0
const S5_WAVES = (() => { const r = mulberry32(505), a = []; for (let i = 0; i < 260; i++) { const d = r(); a.push({ x: r() * 2200 - 140, d, len: 20 + 120 * d * r(), ph: r() * TAU }); } return a; })();
const S5_STEAM = (() => { const r = mulberry32(506), a = []; for (let i = 0; i < 70; i++) a.push({ a: r() * Math.PI, sp: 0.3 + r() * 0.9, rad: 70 + r() * 150, up: r(), t0: r() * 0.6 }); return a.sort((p, q) => q.up - p.up); })();

    c.save(); c.translate(BX, HZ + 20); c.scale(0.16 + 0.2 * contact, 1); glow(c, 0, 90, 300, PAL.flameHot, 0.3 + 0.35 * contact); c.restore();

  drawBooster(c, { ls: 0.7, pxm, sil: 0.3, silCol: '#2a221e' });

// ---------------------------------------------------------------- S6 少了一台 16.0–19.2
function S6(c, lt, fx) {

// ---------------------------------------------------------------- S7 入轨 19.2–23.2
const S7_ICE = (() => { const r = mulberry32(707), a = []; for (let i = 0; i < 46; i++) a.push({ u: -26 + r() * 48, vx: -(8 + r() * 30), vy: -(4 + r() * 26), s: 1.2 + r() * 2.4, w: 3 + r() * 9, ph: r() * TAU, t0: 0.5 + r() * 0.9 }); return a; })();
function S7(c, lt, fx) {

  fx.bg = earthCam({ alt: 210, pitch: -22 - 2 * pull, roll: 2, fov: 48 + 26 * pull, sun: v3.norm([0.55, 0.3, 0.78]), cloudT: 0.8 + lt * 0.004 });
  const pxm = lerp(16, 4.2, pull), cx = lerp(930, 1060, pull), cy = lerp(600, 430, pull);

}

// ---------------------------------------------------------------- S8 二十六 23.2–27.2
const S8_SATS = (() => { const r = mulberry32(808), a = []; for (let i = 0; i < 26; i++) a.push({ j: (r() - 0.5) * 2, w: 1.5 + r() * 2.5, ph: r() * TAU }); return a; })();
function hexRow(c, x0, y, s, n, col) { for (let i = 0; i < n; i++) { const x = x0 + i * s * 1.73; c.beginPath(); for (let k = 0; k < 6; k++) { const a = (Math.PI / 3) * k + Math.PI / 6; c.lineTo(x + Math.cos(a) * s * 0.96, y + Math.sin(a) * s * 0.96); } c.fillStyle = col; c.fill(); } }

// ---------------------------------------------------------------- S9 分岔 27.2–33.6
function S9(c, lt, fx) {

  }

  const path = (tt) => { const e = Math.pow(smooth(2.4, 3.9, tt), 1.3); return [lerp(900, 1470, e), lerp(470, 855, Math.pow(e, 0.8))]; };
  if (lt < 3.3) {
    const [x, y] = path(lt), pxm = 6.5 * (1 - 0.95 * smooth(2.4, 3.2, lt));
    const flipA = Math.PI / 2 + Math.PI * spring(lt - 0.9, 0.7, 0.85);
    const burn = lt >= 1.6 && lt < 2.5 ? smooth(1.6, 1.68, lt) : 0;
    c.save(); c.translate(x, y); c.rotate(flipA); c.scale(pxm, pxm); c.translate(0, 26);
    if (burn) { c.save(); c.translate(0, 1.5); plume(c, 60, 2.8, 18, { ...VAC, core: '#FFFFFF', alpha: burn * 0.9, t: lt, seed: 31 }); c.restore(); }
    drawShip(c, { ls: 1, pxm, sil: 0.45, silCol: '#05070b' });
    c.restore();
    if (burn) glow(c, x + Math.cos(flipA - Math.PI / 2) * 26 * pxm * -1, y, 110, '#C9C6FF', 0.45 * burn);
  }
  if (lt > 2.7 && lt < 4.0) {                          // 再入等离子体
    const fade = 1 - smooth(3.6, 3.95, lt), on = smooth(2.7, 2.95, lt);
    for (let k = 16; k >= 0; k--) {
      const tt = lt - k * 0.025; if (tt < 2.7) continue;
      const [x, y] = path(tt), a = (1 - k / 17) * fade * on;
      glow(c, x, y, 8 + 26 * (1 - k / 17), k < 3 ? PAL.plasmaCore : k < 9 ? PAL.plasma : PAL.plasmaEdge, 0.55 * a);
    }
    const [x, y] = path(lt); glow(c, x, y, 70, PAL.plasma, 0.5 * fade * on);
  }
  if (lt > 3.72 && lt < 4.2) glow(c, 1478, 862, 26, '#FFE6C8', Math.exp(-(lt - 3.75) / 0.08) * smooth(3.72, 3.76, lt));   // 溅落的一闪
  // 抬头：它还在
  if (lt >= 4.0) {
    const tt = Math.max(0, lt - 4.8), A = 50 * DEG, dir = [Math.sin(A), -Math.cos(A)], adv = 150 * tt * tt + 40 * tt;
    const x = 1150 + dir[0] * adv, y = 400 - (1 - tilt) * 950 + dir[1] * adv;
    const pxm = 7 * (1 - 0.45 * smooth(4.8, 6.4, lt)), ign = smooth(4.35, 4.5, lt);
    c.save(); c.translate(x, y); c.rotate(A); c.scale(pxm, pxm); c.translate(0, 26);
    if (ign > 0) { c.save(); c.translate(0, 1.5); plume(c, 90 + 50 * ign, 8, 46, { ...VAC, alpha: 0.38 * ign, t: lt, seed: 41 }); c.restore(); }
    drawShip(c, { ls: 1, pxm, rim: 0.5, rimCol: '#FFC98A', heat: [0, ign] });   // 左侧那台 RVac 依然是黑的
    c.restore();
    if (ign > 0) glow(c, x - dir[0] * 27 * pxm, y - dir[1] * 27 * pxm, 170, '#DCD8FF', 0.5 * ign * (0.85 + 0.15 * Math.sin(lt * 40)));
  }
  typeLine(c, TEXT.t2.en, 150, 800, FONT_SERIF(400, 76), PAL.type, 4.4, 0.13, lt, { byWord: true, track: 1 });   // 文字 2
  typeLine(c, TEXT.t2.zh, 150, 884, FONT_SERIF(600, 56), PAL.typeDim, 5.0, 0.07, lt, { track: 4 });
  Object.assign(fx.post, { bloom: 0.75 });
}

// ---------------------------------------------------------------- S10 远去 33.6–36.8
const P_MATCH = [1210, 470];   // S10 尾焰光点 = S11 土星环高光（点光匹配剪辑）
function S10(c, lt, fx) {
  const d = 7500 * Math.exp(lt * 1.05), ms = smooth(1.0, 2.3, lt);
  fx.bg = {
    mode: 1, cam: { pos: [0, 0, 0], rot: camBasis(0, 0, 0), tanFov: Math.tan(34 * DEG) }, sun: v3.norm([0.9, 0.25, 0.35]),
    earthPos: v3.mul(v3.norm([-0.95, -0.62, 0.55]), d), earthR: 6371, moonPos: [lerp(-17000, 17000, ms), lerp(3200, 1800, ms), 6500], moonR: 1737, stars: 0.7, cloudT: 6,
  };
  const k = Math.exp(-lt * 1.25), A = [lerp(P_MATCH[0], 1000, k), lerp(P_MATCH[1], 660, k)], Ra = 180 * k;
  if (lt < 2.6) {
    const eng = sixEngines({ rvac: [{ on: 0, heat: 0, cool: '#2a1712' }, { on: 1, heat: 1 }, { on: 1, heat: 1 }], rsl: [{ on: 1, heat: 0.4 }, { on: 1, heat: 0.4 }, { on: 1, heat: 0.4 }] });
    aftView(c, { A, axisAng: 0.75, len: 900 * k, Ra, Rn: Ra * 0.7, tilt: 0.55, engines: eng, t: lt + 33.6, plumeLen: 700 * k + 60, tileSide: 1 });
  }
  glow(c, A[0], A[1], 30 + 60 * (1 - k), '#E4E0FF', 0.6 + 0.4 * smooth(2.0, 3.0, lt));
  fx.post.tint = mix([255, 199, 148], [255, 245, 235], smooth(0, 3.2, lt)).map((v) => v / 255);
  fx.post.grain = lerp(0.04, 0.028, smooth(0, 3.2, lt));
}

// ---------------------------------------------------------------- S11 土星 36.8–41.6 · S12 穿越 41.6–44.8
const WH_POS = [3.3, 0.35, 1.2], WH_R = 0.75, SAT_SUN = v3.norm([-0.9, 0.36, -0.12]);
function satCam(lt) {
  const pan = 34 * spring(lt - 1.6, 0.35, 1), dolly = spring(lt - 3.0, 0.3, 1);
  const pos0 = [-0.35, 0.19, -2.85];
  return { pos: v3.add(pos0, v3.mul(v3.sub(WH_POS, pos0), 0.3 * dolly)), rot: camBasis(-22 + pan, -2.5, -8), tanFov: Math.tan(32 * DEG) };
}
function S11(c, lt, fx) {
  const cam = satCam(lt);
  fx.bg = { mode: 2, cam, sun: SAT_SUN, satPos: [0, 0, 0], satRot: IDENT, whPos: WH_POS, whR: WH_R, stars: 1 };
  if (lt < 0.6) glow(c, P_MATCH[0], P_MATCH[1], 60, '#FFFFFF', 0.9 * Math.exp(-lt / 0.18));
  const pw = project(cam, WH_POS), f = 0.1 + 0.55 * smooth(0.3, 4.8, lt);
  const x = lerp(420, pw[0], f), y = lerp(820, pw[1], f);
  glow(c, x, y, 26, '#E4E0FF', 0.9); glow(c, x, y, 6, '#FFFFFF', 1);
  Object.assign(fx.post, { bloom: 0.65 });
}
function S12(c, lt, fx) {
  if (lt < 0.8) {
    const back = v3.norm(v3.sub(satCam(4.8).pos, WH_POS)), dist = lerp(2.6, 1.3, smooth(0, 0.8, lt)) * WH_R;
    const pos = v3.add(WH_POS, v3.mul(back, dist));
    fx.bg = { mode: 2, cam: { pos, rot: lookAt(pos, WH_POS, [0, 1, 0], -10), tanFov: Math.tan(30 * DEG) }, sun: SAT_SUN, satPos: [0, 0, 0], satRot: IDENT, whPos: WH_POS, whR: WH_R, stars: 1 };
    const s = 1 - smooth(0.1, 0.8, lt), pxm = 1.6 * s + 0.05;
    c.save(); c.translate(960 - 120 * s, 560 + 60 * s); c.rotate(Math.PI / 2 - 0.3); c.scale(pxm, pxm); c.translate(0, 26);
    drawShip(c, { sil: 1, silCol: '#040303', pxm }); c.restore();
  } else {
    const k = lt - 0.8, sh = [0.012 * fbm1(lt * 18, 1), 0.012 * fbm1(lt * 18, 2)];
    fx.bg = { mode: 3, cam: { pos: [0, 0, 0], rot: camBasis(0, 0, 0), tanFov: 0.5 }, tun: k, tunLine: smooth(2.0, 3.2, lt), tunShake: sh, tunRoll: 10 * DEG * spring(k, 0.3, 1) };
  }
  typeLine(c, TEXT.t3.en, 150, 820, FONT_SERIF(400, 64), PAL.type, 0.1, 0.1, lt, { byWord: true, track: 1 });   // 文字 3
  typeLine(c, TEXT.t3.zh, 150, 900, FONT_SERIF(600, 56), PAL.typeDim, 0.95, 0.07, lt, { track: 4 });
  Object.assign(fx.post, { bloom: 0.8, vig: 0.28 });
}

// ---------------------------------------------------------------- S13 卡冈图雅 44.8–56.0 · S14 环 56.0–60.0（同一个连续镜头）
const photonAlpha = (rc) => Math.asin(3 * Math.sqrt(3) * Math.sqrt(1 - 2 / rc) / rc);
const bhRc = (tau) => { const x = inv(0, 14.8, tau); return lerp(36, 26, 1 - Math.pow(1 - x, 2.2)); };
const BH_TAN0 = Math.tan(25 * DEG), BH_TAN1 = (Math.tan(photonAlpha(26)) * 540) / RING_PX;   // 片尾光子环半径 = RING_PX
function bhCam(t) {
  const tau = t - 44.8, rc = bhRc(tau);
  const x = inv(6.4, 14.8, tau), incl = (3.5 + 86.5 * x * x * (3 - 2 * x)) * DEG;
  const az = 0.3 * tau * DEG, ci = Math.cos(incl), si = Math.sin(incl), ca = Math.cos(az), sa = Math.sin(az);
  const pos = [rc * ci * sa, rc * si, rc * ci * ca], up = [-si * sa, ci, -si * ca];
  const drift = (1 - smooth(0, 7.5, tau)) * rc * 0.16;   // 开场黑洞偏在画右，慢慢摇回正中（片尾必须居中以便循环）
  const f0 = v3.norm(v3.mul(pos, -1)), r0 = v3.norm(v3.cross(up, f0));
  const f = v3.norm(v3.sub(v3.mul(r0, -drift), pos)), r = v3.norm(v3.cross(up, f)), u = v3.cross(f, r);
  const roll = 5 * DEG * (1 - spring(tau, 0.3, 1)), cr = Math.cos(roll), sr = Math.sin(roll);
  const rot = [v3.add(v3.mul(r, cr), v3.mul(u, sr)), v3.add(v3.mul(u, cr), v3.mul(r, -sr)), f];
  return { pos, rot, tanFov: lerp(BH_TAN0, BH_TAN1, smooth(2, 14.8, tau)), rc };
}
const ringPx = (t) => { const cam = bhCam(t); return (Math.tan(photonAlpha(cam.rc)) / cam.tanFov) * 540; };
const bhCenter = (t) => project(bhCam(t), [0, 0, 0]);
function flickPhase(t) { let ph = 0; const n = 120, a = 47.0; for (let i = 0; i < n; i++) { const tt = a + ((t - a) * (i + 0.5)) / n; ph += 11 * (1 - 0.94 * smooth(53.6, 57.6, tt)); } return (ph * (t - a)) / n; }
function S13(c, lt, fx, t) {
  const cam = bhCam(t);
  fx.bg = { mode: 4, cam, rc: cam.rc, diskT: t * 11, stars: 0.55, skyRot: IDENT, diskGain: lerp(1, 0.38, smooth(51.2, 57.5, t)) };
  if (t < 45.4) fx.post.white = 0.7 * Math.exp(-(t - 44.8) / 0.18);   // 冲出虫洞
  if (t >= 47.0) {                                     // 飞船：横穿透镜光弧 → 落向内盘 → 在光子环上「凝固」
    const R = ringPx(t), C = bhCenter(t), P_END = [C[0] + Math.cos(-40 * DEG) * R * 1.04, C[1] + Math.sin(-40 * DEG) * R * 1.04];
    const b = smooth(47.0, 51.2, t), cIn = smooth(51.0, 56.0, t);
    const cross = [lerp(C[0] - 760, C[0] + 330, b), C[1] - 1.42 * R - 12 * Math.sin(Math.PI * b)];
    const x = lerp(cross[0], P_END[0], cIn), y = lerp(cross[1], P_END[1], cIn);
    const pxm = lerp(2.7, 0.25, smooth(51.2, 56.5, t));
    const slow = smooth(53.6, 57.6, t);
    const fl = 0.55 + 0.45 * Math.sin(TAU * flickPhase(t));
    const pc = mix('#DCE4FF', '#FF4A20', slow), dim = 1 - 0.75 * slow;
    if (pxm > 0.4) {
      c.save(); c.translate(x, y); c.rotate(Math.PI / 2 + 0.5 * cIn); c.scale(pxm, pxm); c.translate(0, 26);
      drawShip(c, { sil: 1, silCol: '#050403', pxm }); c.restore();
    }
    const ex = x - Math.cos(0.5 * cIn) * 27 * pxm, ey = y - Math.sin(0.5 * cIn) * 27 * pxm;
    glow(c, ex, ey, 10 + 16 * pxm, pc, (0.5 + 0.5 * fl) * dim);
    glow(c, ex, ey, 4 + 6 * pxm, '#FFFFFF', 0.8 * fl * dim * (1 - slow));
  }
  Object.assign(fx.post, { bloom: 0.95, thresh: 0.8, vig: 0.16 });
}

// ============================================================ 时间线

const SHOTS = [
  { id: 'S1', t0: 0, t1: 2.4, draw: S1 }, { id: 'S2', t0: 2.4, t1: 6.4, draw: S2 }, { id: 'S3', t0: 6.4, t1: 9.6, draw: S3 },
  { id: 'S4', t0: 9.6, t1: 12.8, draw: S4 }, { id: 'S5', t0: 12.8, t1: 16.0, draw: S5 }, { id: 'S6', t0: 16.0, t1: 19.2, draw: S6 },
  { id: 'S7', t0: 19.2, t1: 23.2, draw: S7 }, { id: 'S8', t0: 23.2, t1: 27.2, draw: S8 }, { id: 'S9', t0: 27.2, t1: 33.6, draw: S9 },
  { id: 'S10', t0: 33.6, t1: 36.8, draw: S10 }, { id: 'S11', t0: 36.8, t1: 41.6, draw: S11 }, { id: 'S12', t0: 41.6, t1: 44.8, draw: S12 },
  { id: 'S13', t0: 44.8, t1: 56.0, draw: S13 }, { id: 'S14', t0: 56.0, t1: 60.0, draw: S13 },
];
function postDefaults(t) {
  const dream = t >= 33.6;
  return { bloom: 0.55, thresh: 0.72, tint: dream ? [1, 0.96, 0.92] : [1, 0.78, 0.58], grain: dream ? 0.028 : 0.04, vig: 0.13, ca: 1.2, shimmer: 0, shimmerY: 0, exposure: 1, white: 0 };
}
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  const shot = SHOTS.find((s) => t < s.t1) || SHOTS[SHOTS.length - 1];
  const fx = { bg: null, post: postDefaults(t) };
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  shot.draw(ctx, t - shot.t0, fx, t);
  renderGL(fx, t);
  window.SHOT = shot.id;
}
window.seek = seek;
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
window.PAGE_INFO = { webgl: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'webgl2', hdr: HDR === gl.RGBA16F };
window.ready = loadFonts().then(() => { seek(0); return true; });

// 普通浏览器：实时循环预览（空格暂停，←/→ 一拍，?t= 定格）
// 有 out/score.wav（node audio/score.mjs 生成）时，点一下页面即带声播放，画面跟着音轨的时钟走
if (!navigator.webdriver) {
  const hold = Q.has('t') ? +Q.get('t') : null;
  let playing = hold == null, cur = hold ?? 0, base = performance.now() / 1000 - cur, audioOn = false;
  const audio = new Audio('out/score.wav'); audio.preload = 'auto';
  const syncAudio = () => { if (!audioOn) return; audio.currentTime = cur; if (playing) audio.play().catch(() => {}); else audio.pause(); };
  const enableAudio = () => { if (!audioOn) { audioOn = true; syncAudio(); } };
  addEventListener('pointerdown', enableAudio);
  window.ready.then(() => {
    seek(cur);
    const loop = () => {
      if (playing) {
        if (audioOn && !audio.paused && !audio.ended) { cur = audio.currentTime; base = performance.now() / 1000 - cur; }
        else { cur = (performance.now() / 1000 - base) % DURATION; if (audioOn && audio.ended) syncAudio(); }
        seek(Math.min(cur, DURATION - 1e-3));
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  addEventListener('keydown', (e) => {
    enableAudio();
    if (e.code === 'Space') { playing = !playing; base = performance.now() / 1000 - cur; syncAudio(); e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { cur = (((cur + (e.code === 'ArrowRight' ? 0.8 : -0.8)) % DURATION) + DURATION) % DURATION; base = performance.now() / 1000 - cur; seek(cur); syncAudio(); }
  });
}
</script>
